<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="brand-badge">M</span>
      <h1>Tạo tài khoản MiniMart</h1>
      <p>Đăng ký thành viên để mua sắm và tích điểm.</p>
    </div>
    @if (successMsg()) {
      <div class="success">{{ successMsg() }}</div>
    }
    @if (errorMsg()) {
      <div class="alert">{{ errorMsg() }}</div>
    }
    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label>Họ và tên</label
          ><input
            class="form-input"
            placeholder="Nguyễn Minh Anh"
            [(ngModel)]="form.fullName"
            name="fullName"
            required
          />
        </div>
        <div class="form-group">
          <label>Tên đăng nhập</label
          ><input
            class="form-input"
            placeholder="minhanh"
            [(ngModel)]="form.username"
            name="username"
            required
          />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label
          ><input
            type="email"
            class="form-input"
            placeholder="ban@email.com"
            [(ngModel)]="form.email"
            name="email"
            required
            email
          />
        </div>
        <div class="form-group">
          <label>Số điện thoại</label
          ><input
            type="tel"
            class="form-input"
            placeholder="0901 234 567"
            [(ngModel)]="form.phoneNumber"
            name="phoneNumber"
            required
          />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Mật khẩu (ít nhất 6 ký tự)</label
          ><input
            type="password"
            class="form-input"
            [(ngModel)]="form.password"
            name="password"
            required
            minlength="6"
          />
        </div>
        <div class="form-group">
          <label>Xác nhận mật khẩu</label
          ><input
            type="password"
            class="form-input"
            [(ngModel)]="form.confirmPassword"
            name="confirmPassword"
            required
          />
        </div>
      </div>
      <button class="submit" type="submit" [disabled]="isLoading() || f.invalid">
        {{ isLoading() ? 'Đang tạo tài khoản…' : 'Tạo tài khoản khách hàng' }}
      </button>
      <p class="footer">Đã là thành viên? <a routerLink="/login">Đăng nhập bằng email</a></p>
    </form>
  </div>
</section>
