<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="brand-badge">M</span>
      <h1>Chào mừng bạn trở lại</h1>
      <p>Đăng nhập MiniMart bằng email của bạn.</p>
    </div>
    <form (ngSubmit)="onSubmit()" #f="ngForm">
      @if (errorMsg()) {
        <div class="alert">{{ errorMsg() }}</div>
      }
      <div class="form-group">
        <label for="email">Email</label
        ><input
          id="email"
          type="email"
          class="form-input"
          placeholder="ban@email.com"
          [(ngModel)]="form.email"
          name="email"
          required
          email
          autocomplete="email"
        />
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="password">
          <input
            id="password"
            [type]="showPwd() ? 'text' : 'password'"
            class="form-input"
            placeholder="Nhập mật khẩu"
            [(ngModel)]="form.password"
            name="password"
            required
            autocomplete="current-password"
          /><button type="button" (click)="togglePwd()">{{ showPwd() ? 'Ẩn' : 'Hiện' }}</button>
        </div>
      </div>
      <button class="submit" type="submit" [disabled]="isLoading() || f.invalid">
        {{ isLoading() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
      </button>
      <p class="footer">
        Chưa có tài khoản? <a routerLink="/register">Tạo tài khoản khách hàng</a>
      </p>
    </form>
  </div>
</section>
